<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шахматы на GitHub Pages</title>
  <!-- Подключаем стили шахматной доски и фигур -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 { margin-bottom: 10px; }
    #board { width: 400px; max-width: 90vw; }
    .status { margin-top: 15px; font-size: 1.1rem; }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 1rem;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover { background: #45a049; }
  </style>
</head>
<body>

  <h1>Шахматы в браузере</h1>
  <div id="board"></div>
  <div class="status" id="status">Ход белых</div>
  <button id="resetBtn">Новая игра</button>

  <!-- Подключаем jQuery, Chess.js (логика правил) и Chessboard.js (графика) -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

  <script>
    let board = null;
    const game = new Chess();
    const $status = $('#status');

    function makeRandomMove() {
      const possibleMoves = game.moves();
      if (game.game_over()) return;

      const randomIdx = Math.floor(Math.random() * possibleMoves.length);
      game.move(possibleMoves[randomIdx]);
      board.position(game.fen());
      updateStatus();
    }

    function onDragStart(source, piece, position, orientation) {
      if (game.game_over()) return false;
      if (piece.search(/^b/) !== -1) return false; // Играем за белых
    }

    function onDrop(source, target) {
      const move = game.move({
        from: source,
        to: target,
        promotion: 'q' // Авто-превращение в ферзя для простоты
      });

      if (move === null) return 'snapback';

      updateStatus();
      window.setTimeout(makeRandomMove, 250);
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    function updateStatus() {
      let status = '';
      let moveColor = game.turn() === 'b' ? 'Черных' : 'Белых';

      if (game.in_checkmate()) {
        status = 'Игра окончена, мат! Победили ' + (game.turn() === 'w' ? 'Черные' : 'Белые');
      } else if (game.in_draw()) {
        status = 'Ничья!';
      } else {
        status = 'Ход: ' + moveColor;
        if (game.in_check()) {
          status += ', ШАХ!';
        }
      }
      $status.html(status);
    }

    const config = {
      draggable: true,
      position: 'start',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd
    };

    board = Chessboard('board', config);
    updateStatus();

    $('#resetBtn').on('click', () => {
      game.reset();
      board.start();
      updateStatus();
    });
  </script>
</body>
</html>
